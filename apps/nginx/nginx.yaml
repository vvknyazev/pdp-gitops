apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: pdp

data:
  default.conf: |
    server {
        listen 80;

        location / {
            default_type text/plain;
            return 200 "Hello from MicroK8s NGINX\n";
        }
    }

    server {
        listen 8080;

        location /stub_status {
            stub_status;
            access_log off;

            allow 127.0.0.1;
            deny all;
        }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: pdp

spec:
  replicas: 3

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      containers:

        - name: nginx
          image: nginx:alpine

          ports:
            - name: http
              containerPort: 80

            - name: status
              containerPort: 8080

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf

        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.5.3

          args:
            - --nginx.scrape-uri=http://127.0.0.1:8080/stub_status

          ports:
            - name: metrics
              containerPort: 9113

      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config

---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: pdp

spec:
  type: NodePort

  selector:
    app: nginx

  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
